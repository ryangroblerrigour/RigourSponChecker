services:
  - type: web
    name: rigoursponcheck
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: API_KEY
        generateValue: true
      - key: DEFAULT_CODEFRAME
        value: parcel_carriers_uk
      - key: DATABASE_URL
        fromDatabase:
          name: rigoursponcheck-db
          property: connectionString

databases:
  - name: rigoursponcheck-db
    plan: basic-256mb
